<div class="modal-content flex justify-content-center align-items-center">
    <!--begin::Modal header-->
    <div class="modal-header align-items-center " >
        <!--begin::Modal title-->
        <h2 class="fw-bolder text-center">Confirm bbrach deletion: {{ BRANCH_SELECTED.name +" "+ BRANCH_SELECTED.address }}</h2>
        
        <!--end::Modal title-->
 
    </div>
    <!--end::Modal header-->
    <!--begin::Modal body-->
    <div class="modal-body scroll-y mx-5 mx-xl-15 my-7">
        <!--begin::Form-->
        <form id="kt_modal_delete_brach_form" class="form" action="#">
            <p style="font-size: 1.3rem;">
                This action cannot be undone. Do you wish to proceed? 
            </p>
            <div class="text-center pt-15">
                <button type="reset" class="btn btn-light me-3" (click)="modal.dismiss()">Cancel</button>
                <button type="button" (click)="delete(BRANCH_SELECTED)" class="btn btn-danger" data-kt-users-modal-action="submit">
                    <span class="indicator-label">Delete</span>

                    <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
                </button>
            </div>
        </form>
        <!--end::Form-->
    </div>
    <!--end::Modal body-->
</div>
<!--end::Modal content-->
