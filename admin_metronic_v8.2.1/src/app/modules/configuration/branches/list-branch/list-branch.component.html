 <div class="card">
    <!--begin::Card header-->
    <div class="card-header border-0 pt-6">
        <!--begin::Card title-->
        <div class="card-title">
            <!--begin::Search-->
            <div class="d-flex align-items-center position-relative my-1">
                <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-5"><span class="path1"></span><span
                        class="path2"></span></i> <input type="text" data-kt-branch-table-filter="search"
                    class="form-contbranch form-contbranch-solid w-250px ps-13" placeholder="Search Branch" [(ngModel)]="search" (keyup.enter)="listBranches()" >
            </div>
            <!--end::Search-->
        </div>
        <!--begin::Card title-->
        <span class="spinner-border soinner-border-sm align-middle ms-2" *ngIf="isLoadingBranches$ | async"></span>
        <!--begin::Card toolbar-->
        <div class="card-toolbar">
            <!--begin::Toolbar-->
            <div *appCan="'register_branch'"
            class="d-flex justify-content-end" data-kt-branch-table-toolbar="base">

                <!--begin::Add branch--> 
                <button *appCan="'register_branch'"
                 (click)="createBranch()" type="button" class="btn btn-primary fw-bold" data-kt-drawer-toggle="#kt_drawer_create_branch">
                     
                    <i class="fa fa-branch-plus me-2 fs-4"></i> Add Branch
                </button>
                <!--end::Add branch-->
            </div>
            <!--end::Toolbar-->

 
        </div>
        <!--end::Card toolbar-->
    </div>
    <!--end::Card header-->

    <!--begin::Card body-->
    <div class="card-body pt-0">

        <!--begin::Table-->
        <div id="kt_branches_table_wrapper" class="dt-container dt-bootstrap5 dt-empty-footer">
            <div id="" class="table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-5 dataTable" id="kt_branches_table"
                    style="width: 100%;"> 
                    <thead>
                        <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">
 
                            <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="1" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Full name</span><span
                                        class="dt-column-order" branche="button"
                                        aria-label="Customer Name: Activate to sort" tabindex="0"></span></div>
                            </th>
                            <th 
                            class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="2" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Phone</span><span
                                        class="dt-column-order" branche="button" aria-label="Email: Activate to sort"
                                        tabindex="0"></span></div>
                            </th>
                            
                               <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="2" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Address</span><span
                                        class="dt-column-order" branche="button" aria-label="Email: Activate to sort"
                                        tabindex="0"></span></div>
                            </th> 
                            <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="5" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Updated Date</span><span
                                        class="dt-column-order" branche="button"
                                        aria-label="Created Date: Activate to sort" tabindex="0"></span></div>
                            </th>
                
                            <th *appCan="['edit_branch', 'delete_branch']; mode: 'any'"
                            class="text-end min-w-70px dt-orderable-none" data-dt-column="6" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Actions</span><span
                                        class="dt-column-order"></span></div>
                            </th> 
                        </tr>
                    </thead>
                    <tbody class="fw-semibold text-gray-600" *ngIf="BRANCHES && BRANCHES.length > 0">

                        <ng-container *ngFor="let BRANCH of BRANCHES">
                            <tr> 
                                <td class="d-flex align-items-center sorting_1">
                                        <div class="symbol symbol-circle symbol-50px overflow-hidden me-3" data-action="view" data-id="16">
                                            <a href="#">
                                            
                                        <div class="symbol-label symbol-40px me-5">
                                           
                                            <!-- <img [src]="URL_STORAGE + (Branch.avatar ?? 'branch.png')" alt="avatar" class="w-40px h-40px rounded-circle object-fit-cover"> -->
                                        </div>
                                        
                                            </a>
                                        </div>
                                        
                                        <div class="d-flex flex-column" data-action="view" data-id="">
                                            <a href="" class="text-gray-800 text-hover-primary mb-1">{{BRANCH.name}} </a>
                                            <span> {{BRANCH.phone}} </span>
                                            
                                        </div> 
                                </td> 
                               
                                <td>
                                    <span> </span>
                                </td>
                            <td>
                                <!-- reemplazar aqui por el desarrollo del last_seen-->
                                    <span> </span>
                                </td>
                                <td *appCan="['edit_branch', 'delete_branch']; mode: 'any'"> 
                                    <a *appCan="'edit_branch'"
                                    href="#" onclick="return false;" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1">
                                        <i class="ki-duotone ki-pencil fs-2" (click)="editBranch(BRANCH)">
                                            <span class="path1"></span>
                                            <span class="path2"></span>
                                        </i>
                                    </a>
                                    <a   *appCan="'delete_branch'"
                                    class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm">
                                        <i class="ki-duotone ki-trash fs-2" (click)="deleteBranch(BRANCH)"><span class="path1"></span>
                                            <span class="path2"></span><span class="path3"></span>
                                            <span class="path4"></span><span class="path5"></span>
                                        </i>
                                    </a>
                                </td>

                            </tr >
                            
                            <tr *ngIf="expandedRow && expandedRow?.branchId === BRANCH.id">
                            <td [attr.colspan]="colspan">
                                <div class="p-5 bg-light"> 
                                <!-- Si la sección activa es roles -->
                              <div *ngIf="expandedRow?.section === 'roles'" class="my-3">
  
                                    <div class="d-flex align-items-center mb-4">
                                        <div class="p-1.5 bg-light-primary text-primary rounded-2 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                        <i class="bi bi-shield-lock fs-5"></i>
                                        </div>
                                        <h6 class="text-uppercase text-dark fw-bold mb-0 tracking-wider" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                                   
                                        </h6>
                                    </div>

                         

                          
                                    </div>

                                <!-- Si la sección activa es branch/sucursal -->
                                <div *ngIf="expandedRow?.section === 'branch'">
                                    <div class="card border-0 shadow-sm my-3 bg-light-neutral">
                                        <div class="card-body p-4">
                                            
                                            <div class="d-flex align-items-center mb-3">
                                            <div class="p-2 bg-light-primary text-primary rounded-3 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                                <i class="bi bi-building fs-4"></i> </div>
                                            <div>
                                                <span class="text-muted text-uppercase fw-bold tracking-wider" style="font-size: 0.75rem; letter-spacing: 0.5px;">Assigned Branch</span>
                                                <h5 class="card-title text-dark fw-bold mb-0 mt-0">
                                               
                                                </h5>
                                            </div>
                                            </div>

                                            <hr class="text-muted opacity-15 my-3">

                                            <div class="row g-3">
                                            
                                            <div class="col-sm-6">
                                                <div class="d-flex align-items-center">
                                                <span class="text-secondary me-2"><i class="bi bi-hash"></i></span>
                                                <div>
                                                    <div class="text-muted lh-1" style="font-size: 0.8rem;">   _____</div>
                                                    <span class="badge bg-light-primary text-primary fw-semibold mt-1 px-2.5 py-1.5" style="font-size: 0.85rem;">
                                                     
                                                    </span>
                                                </div>
                                                </div>
                                            </div>

                                            <div class="col-sm-6">
                                                <div class="d-flex align-items-start">
                                                <span class="text-secondary me-2 mt-0.5"><i class="bi bi-geo-alt"></i></span>
                                                <div>
                                          
                                                </div>
                                                </div>
                                            </div>

                                            </div>

                                        </div>
                                        </div>
                                </div>

                                </div>
                            </td>
                            
                            </tr> 
                        </ng-container>  
                    </tbody>
                    <!--end::Table [PageSize]="pageSize"body-->
                    <tfoot></tfoot>
                </table>
            </div> 
            <ngb-pagination
                [collectionSize] = "totalPages"
                [(page)]="currentPage"
                
                [rotate]="true"
                (pageChange)="loadPage($event)"
                [boundaryLinks]="true"
            >

            </ngb-pagination> 
        </div>
        <!--end::Table-->
    </div>
    <!--end::Card body-->
</div>
