<div class="card card-flush shadow-sm">
  <!--begin::Card header-->
  <div class="card-header align-items-center py-5">
    <div class="card-title">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1">
        <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-4 text-gray-500">
            <span class="path1"></span><span class="path2"></span>
        </i>
        <input type="text" [(ngModel)]="search" (keyup.enter)="listBranches()" 
               class="form-control form-control-solid w-250px ps-12" placeholder="Search Branch...">
      </div>
      <span class="spinner-border spinner-border-sm align-middle ms-3 text-primary" *ngIf="isLoadingBranches$ | async"></span>
      <!--end::Search-->
    </div>
    
    <div class="card-toolbar">
      <button *appCan="'register_branch'" (click)="createBranch()" class="btn btn-primary fw-bold">
        <i class="ki-duotone ki-plus fs-2"></i> Add Branch
      </button>
    </div>
  </div>
  <!--end::Card header-->

  <!--begin::Card body-->
  <div class="card-body pt-0">
    <div class="table-responsive">
      <table class="table align-middle table-row-dashed fs-6 gy-5" id="kt_branches_table">
        <thead class="text-gray-500 fw-bold fs-7 text-uppercase border-bottom-0">
          <tr>
            <th class="w-50px">Image</th>
            <th>Name</th>
            <th>Phones</th>
            <th>Address</th>
            <th>Updated Date</th>
            <th class="text-end min-w-100px">Actions</th>
          </tr>
        </thead>
        <tbody class="fw-semibold text-gray-600">
          <ng-container *ngFor="let branch of BRANCHES">
            <tr>
              <td>
                <pre>{{branch.images.is_main   }} </pre>
                <div class="symbol symbol-40px symbol-circle">
                  <img class="symbol-label" [src]="getMainImageUrl(branch)"> 
                </div>
              </td>
              <td><span class="text-gray-800 fw-bold">{{branch.name}}</span></td>
              <td>
                <div class="d-flex flex-column">
                  <span *ngFor="let phone of branch.phone" class="text-muted fs-7">{{phone.number}}</span>
                </div>
                
              </td> 
              <td>  
                <span *ngIf="branch.latitude !== '1.00000000'"  class="text-gray-600"(click)="openMap(branch)"  
                        data-bs-toggle="tooltip" 
                        data-bs-placement="top" 
                        title="Show map" 
                class="cursor-pointer">{{branch.address}}</span>
                <span *ngIf="branch.latitude === '1.00000000'"  class="text-gray-600"  >{{branch.address}}</span>
              </td>
              <td><span class="text-gray-500 fs-7">{{branch.last_updated }}</span></td>
              <td class="text-end">
                <button (click)="editBranch(branch)" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1">
                  <i class="ki-duotone ki-pencil fs-3"><span class="path1"></span><span class="path2"></span></i>
                </button>
                <button (click)="deleteBranch(branch)" class="btn btn-icon btn-bg-light btn-active-color-danger btn-sm">
                  <i class="ki-duotone ki-trash fs-3"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span></i>
                </button>
              </td>
            </tr>

            <!-- Expanded row logic would go here -->
          </ng-container>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-end pt-5">
      <ngb-pagination [collectionSize]="totalPages" [(page)]="currentPage" [pageSize]="10" 
                      (pageChange)="loadPage($event)" [boundaryLinks]="true">
      </ngb-pagination>
    </div>
  </div>
  <!--end::Card body-->
</div>

<div *ngIf="activeMapData" class="map-overlay-container">
 
    <div class="floating-map-panel shadow-lg rounded">
        <div class="panel-header p-3 border-bottom d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark">Ubication: {{ activeMapData.name }}</span>
            <button class="btn btn-sm btn-icon btn-light" (click)="closeMap()">
                 <span>X</span>
            </button>
        </div>
        <div class="panel-body">
    
    <app-map 
        [lat]="activeMapData.lat" 
        [lon]="activeMapData.lon" 
        [mapId]="activeMapData.id">
    </app-map>
</div>
    </div>
</div>
