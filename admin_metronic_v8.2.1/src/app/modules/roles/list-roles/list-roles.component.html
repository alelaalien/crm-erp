<div class="card">
    <!--begin::Card header-->
    <div class="card-header border-0 pt-6">
        <!--begin::Card title-->
        <div class="card-title">
            <!--begin::Search-->
            <div class="d-flex align-items-center position-relative my-1">
                <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-5"><span class="path1"></span><span
                        class="path2"></span></i> <input type="text" data-kt-rol-table-filter="search"
                    class="form-control form-control-solid w-250px ps-13" placeholder="Search Roles" [(ngModel)]="search" (keyup.enter)="listRoles()" >
            </div>
            <!--end::Search-->
        </div>
        <!--begin::Card title-->
        <span class="spinner-border soinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
        <!--begin::Card toolbar--> 
        <div class="card-toolbar">
            <!--begin::Toolbar-->
            <div class="d-flex justify-content-end" data-kt-rol-table-toolbar="base">

                <!--begin::Add rol-->
                <button type="button" class="btn btn-primary" (click)="createRol()" *appCan="'register_role'">
                   + Add Role
                </button>
                <!--end::Add rol-->
            </div>
            <!--end::Toolbar-->

            <!--begin::Group actions-->
            <div class="d-flex justify-content-end align-items-center d-none" data-kt-rol-table-toolbar="selected">
                <div class="fw-bold me-5">
                    <span class="me-2" data-kt-rol-table-select="selected_count"></span> Selected
                </div>

                <ng-container *appCan="'delete_role'">
    <button type="button" class="btn btn-danger">
        Delete Selected
    </button>
</ng-container>
            </div>
            <!--end::Group actions-->
        </div>
        <!--end::Card toolbar-->
    </div>
    <!--end::Card header-->

    <!--begin::Card body-->
    <div class="card-body pt-0">

        <!--begin::Table-->
        <div id="kt_roles_table_wrapper" class="dt-container dt-bootstrap5 dt-empty-footer">
            <div id="" class="table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-5 dataTable" id="kt_roles_table"
                    style="width: 100%;"> 
                    <thead>
                        <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">
 
                            <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="1" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Rol</span><span
                                        class="dt-column-order" role="button"
                                        aria-label="Customer Name: Activate to sort" tabindex="0"></span></div>
                            </th>
                            <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="2" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Permissions</span><span
                                        class="dt-column-order" role="button" aria-label="Email: Activate to sort"
                                        tabindex="0"></span></div>
                            </th> 
                            <th class="min-w-125px dt-orderable-asc dt-orderable-desc" data-dt-column="5" rowspan="1"
                                colspan="1">
                                <div class="dt-column-header"><span class="dt-column-title">Updated Date</span><span
                                        class="dt-column-order" role="button"
                                        aria-label="Created Date: Activate to sort" tabindex="0"></span></div>
                            </th>
                            <th class="text-end min-w-70px dt-orderable-none" data-dt-column="6" rowspan="1"
                                colspan="1" 
                                *appCan="['edit_role', 'delete_role']; mode: 'any'"
                                >
                                <div class="dt-column-header"><span class="dt-column-title">Actions</span><span
                                        class="dt-column-order"></span></div>
                            </th> 
                        </tr>
                    </thead>
                    <tbody class="fw-semibold text-gray-600">
                        
                        <ng-container *ngFor="let rol of ROLES" >
                            <tr>
                                <td>
                                    <!-- <pre>{{ rol | json }}</pre> -->
                                    {{rol.name}}                                    
                                </td>
                              <td><ul> 
                                    <ng-container *ngFor="let item of rol.permissions">
                                    
                                        <li>
                                            {{item}}
                                        </li></ng-container>
                                    </ul>
                                </td>  
                                
                                <td > {{rol.updated_at }} </td>
                                <td class="" *appCan="['edit_role', 'delete_role']; mode: 'any'">
                                    <a href="#" onclick="return false;" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1" *appCan="'edit_role'">
                                        <i class="ki-duotone ki-pencil fs-2" (click)="editRole(rol)">
                                            <span class="path1"></span>
                                            <span class="path2"></span>
                                        </i>
                                    </a>
                                    <a  class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm" *appCan="'delete_role'">
                                        <i class="ki-duotone ki-trash fs-2" (click)="deleteRole(rol)"><span class="path1"></span>
                                            <span class="path2"></span><span class="path3"></span>
                                            <span class="path4"></span><span class="path5"></span>
                                        </i>
                                    </a>
                                </td>
                            </tr>
                        
                        </ng-container>
                        
                <!--             <td>
                                <div class="form-check form-check-sm form-check-custom form-check-solid">
                                    <input class="form-check-input" type="checkbox" value="1">
                                </div>
                            </td> --> 

        
                    </tbody>
                    <!--end::Table [PageSize]="pageSize"body-->
                    <tfoot></tfoot>
                </table>
            </div> 
            <ngb-pagination
                [collectionSize] = "totalPages"
                [(page)]="currentPage"
                
                [rotate]="true"
                (pageChange)="loadPage($event)"
                [boundaryLinks]="true"
            >

            </ngb-pagination> 
        </div>
        <!--end::Table-->
    </div>
    <!--end::Card body-->
</div>
