<ng-container *ngIf="user$ | async as _user">
  <div class="px-7 py-5 bg-light-neutral rounded-top">
    <div class="d-flex align-items-center">
      <div class="symbol symbol-50px me-4">
        <img alt="User avatar" [src]="_user.avatar" class="rounded-circle object-fit-cover shadow-sm" />
      </div>

      <div class="d-flex flex-column">
        <span class="text-dark fw-bold fs-6 text-hover-primary lh-1 mb-1">
          {{ _user.firstname }} {{ _user.lastname }}
        </span>
        <div class="d-flex align-items-center gap-1">
          <span class="text-muted fs-7 fw-normal text-truncate max-w-150px">{{ _user.email }}</span>
        </div>
        <span class="badge badge-light-secondary text-muted fw-semibold fs-9 px-2 py-0.5 mt-1 align-self-start text-uppercase tracking-wide">
          Soporte / Corporativo
        </span>
      </div>
    </div>
  </div>

  <div class="separator my-1 opacity-75"></div>

  <div class="px-3 py-2">
    <span class="text-uppercase fs-9 fw-bold text-muted px-3 tracking-wider d-block my-2">Mi Espacio</span>
    
    <div class="menu-item px-1">
      <a routerLink="/crafted/pages/profile" class="menu-link px-3 py-2 rounded text-dark fs-7">
        <span class="menu-title">Ficha de Empleado</span>
      </a>
    </div>

    <div class="menu-item px-1">
      <a class="menu-link px-3 py-2 rounded text-dark fs-7 d-flex justify-content-between align-items-center cursor-pointer" placement="top-start" ngbTooltip="Próximamente">
        <span class="menu-title">Proyectos Asignados</span>
        <span class="badge badge-secondary fs-8 px-2 py-1 fw-bold text-gray-700">3</span>
      </a>
    </div>
  </div>

  <div class="separator my-1 opacity-50"></div>

  <div class="px-3 py-2">
    <span class="text-uppercase fs-9 fw-bold text-muted px-3 tracking-wider d-block my-2">Preferencias</span>

    <div class="menu-item px-1">
      <a routerLink="/crafted/account/settings" class="menu-link px-3 py-2 rounded text-dark fs-7">
        <span class="menu-title">Configuración de Cuenta</span>
      </a>
    </div>

    <div class="menu-item px-1">
      <div class="menu-link px-3 py-2 rounded d-flex justify-content-between align-items-center position-relative">
        <span class="text-dark fs-7">Idioma del Sistema</span>
        <div class="dropdown" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">
          <span class="fs-8 rounded bg-light border text-gray-700 px-2 py-1 cursor-pointer d-flex align-items-center">
            {{ language.name }}
            <img class="w-15px h-15px rounded-circle ms-2" [src]="language.flag" alt="Language flag" />
          </span>
          
          <div class="menu-sub menu-sub-dropdown w-150px py-2 shadow-sm">
            <div *ngFor="let l of langs" class="menu-item px-2 cursor-pointer" (click)="selectLanguage(l.lang)">
              <a class="menu-link d-flex px-3 py-1.5 fs-7" [ngClass]="l.lang === language.lang ? 'active bg-light-primary' : ''">
                <img class="w-12px h-12px rounded-circle me-3 align-self-center" [src]="l.flag" alt="Flag" />
                {{ l.name }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="menu-item px-3 py-1">
      <div class="d-flex justify-content-between align-items-center w-100 py-1">
        <span class="text-dark fs-7">Alertas del Sistema</span>
        <label class="form-check form-switch form-check-custom form-check-solid">
          <input class="form-check-input w-25px h-15px" type="checkbox" value="1" defaultChecked="{true}" name="notifications" />
        </label>
      </div>
    </div>
  </div>

  <div class="separator mt-2 mb-1 opacity-75"></div>

  <div class="px-3 py-1 mb-1">
    <div class="menu-item px-1">
      <a (click)="logout()" class="menu-link px-3 py-2 rounded text-danger fw-semibold fs-7 cursor-pointer text-hover-danger bg-hover-light-danger">
        <span class="menu-title">Cerrar Sesión Corporativa</span>
      </a>
    </div>
  </div>
</ng-container>
